name: Rebuild from live-app

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this site
        uses: actions/checkout@v4
        with:
          path: site
      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          repository: zenkodanmark/zenko-live-app
          path: srcapp
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: srcapp/package-lock.json
      - run: npm ci
        working-directory: srcapp
      - run: npm run build:pages
        working-directory: srcapp
        env:
          ZENKO_PAGES: "1"
          NITRO_PRESET: github-pages
          ZENKO_PAGES_BASE: "/"
          VITE_AUTH_ENABLED: "false"
      - name: Copy site
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          src = Path("srcapp/.output/public")
          dst = Path("site")
          keep = {".git", ".github"}
          for child in list(dst.iterdir()):
              if child.name in keep:
                  continue
              if not (src / child.name).exists():
                  if child.is_dir():
                      shutil.rmtree(child)
                  else:
                      child.unlink()
          for child in src.iterdir():
              dest = dst / child.name
              if dest.exists():
                  if dest.is_dir():
                      shutil.rmtree(dest)
                  else:
                      dest.unlink()
              if child.is_dir():
                  shutil.copytree(child, dest)
              else:
                  shutil.copy2(child, dest)
          PY
      - name: Commit
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Publicer Zenko Plads."
          git push
