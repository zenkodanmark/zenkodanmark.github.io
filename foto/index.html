<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<title>Zenko Foto-upload</title>
<style>
  :root { --bg:#111; --fg:#fff; --mut:#bbb; --ks:#1565c0; --ex:#ef6c00; --pr:#c62828; --ok:#2e7d32; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:20px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px 16px 40px; }
  h1 { font-size:26px; margin:4px 0 2px; }
  .pl { display:block; font-size:16px; color:var(--mut); font-weight:400; }
  .step { font-size:22px; font-weight:700; margin:22px 0 10px; }
  .cats { display:grid; gap:14px; }
  .cat { width:100%; min-height:96px; border:5px solid transparent; border-radius:18px; color:#fff; font-size:28px; font-weight:800; text-align:left; padding:14px 20px; cursor:pointer; }
  .cat .pl { color:#eee; font-size:18px; }
  .cat[data-v=kvalitetssikring]{background:var(--ks)} .cat[data-v=ekstra_arbejde]{background:var(--ex)} .cat[data-v=problemer]{background:var(--pr)}
  .cat[aria-pressed=true] { border-color:#fff; box-shadow:0 0 0 4px #ffeb3b; }
  .cat[aria-pressed=true]::after { content:" ✔"; }
  .cats.picked .cat[aria-pressed=false] { opacity:.45; }
  .big { display:flex; align-items:center; justify-content:center; width:100%; min-height:96px; border-radius:18px; font-size:26px; font-weight:800; border:4px solid #fff; background:#222; color:#fff; cursor:pointer; text-align:center; padding:10px; }
  .big .pl { color:#ddd; }
  input[type=file] { position:absolute; left:-9999px; }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; margin-top:12px; }
  .thumbs div { position:relative; } .thumbs img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; display:block; }
  .thumbs button { position:absolute; top:4px; right:4px; width:44px; height:44px; border-radius:50%; border:2px solid #fff; background:#000c; color:#fff; font-size:24px; }
  label.f { display:block; margin:18px 0 6px; font-size:20px; font-weight:700; }
  textarea, input[type=text] { width:100%; font-size:22px; padding:14px; border-radius:14px; border:3px solid #888; background:#000; color:#fff; }
  textarea { min-height:96px; }
  #send { margin-top:24px; min-height:110px; background:var(--ok); border-color:var(--ok); font-size:32px; }
  #send:disabled { background:#444; border-color:#444; color:#999; }
  #msg { margin-top:18px; padding:18px; border-radius:16px; font-size:24px; font-weight:700; display:none; }
  #msg.ok { display:block; background:var(--ok); } #msg.err { display:block; background:var(--pr); } #msg.busy { display:block; background:#333; }
  .count { color:var(--mut); margin-top:8px; font-size:18px; }
  .lang { display:flex; justify-content:flex-end; gap:8px; margin:0 0 4px; }
  .lang a { color:#fff; text-decoration:none; font-size:16px; font-weight:800; min-width:48px; min-height:44px; display:flex; align-items:center; justify-content:center; padding:0 12px; border-radius:999px; border:2px solid #666; }
  .lang a[aria-current=page] { background:#fff; color:#111; border-color:#fff; }
</style>
</head>
<body>
<main>
  <nav class="lang" aria-label="Sprog">
    <a href="/foto/" aria-current="page">DA</a>
    <a id="lang-ro" href="/foto/ro/">RO</a>
  </nav>
  <h1>Zenko foto-upload <span class="pl">Wysyłanie zdjęć</span></h1>

  <div class="step">1. Vælg kategori <span class="pl">Wybierz kategorię</span></div>
  <div class="cats" id="cats">
    <button class="cat" type="button" data-v="kvalitetssikring" aria-pressed="false">Kvalitetssikring <span class="pl">Kontrola jakości</span></button>
    <button class="cat" type="button" data-v="ekstra_arbejde" aria-pressed="false">Ekstra arbejde <span class="pl">Dodatkowa praca</span></button>
    <button class="cat" type="button" data-v="problemer" aria-pressed="false">Problemer <span class="pl">Problemy</span></button>
  </div>

  <div class="step">2. Billeder <span class="pl">Zdjęcia</span></div>
  <label class="big" for="files">📷 Tag / vælg billeder<span class="pl">&nbsp;Zrób / wybierz zdjęcia</span></label>
  <input id="files" type="file" accept="image/*" multiple>
  <div class="count" id="count"></div>
  <div class="thumbs" id="thumbs"></div>

  <label class="f" for="note">Note (valgfri) <span class="pl">Notatka (opcjonalnie)</span></label>
  <textarea id="note" maxlength="1000" placeholder="Hvor / hvad? · Gdzie / co?"></textarea>

  <label class="f" for="name">Dit navn <span class="pl">Twoje imię</span></label>
  <input id="name" type="text" maxlength="80" autocomplete="name" placeholder="fx Marian">

  <button class="big" id="send" type="button" disabled>SEND <span class="pl">&nbsp;Wyślij</span></button>
  <div id="msg" role="status" aria-live="polite"></div>
</main>
<script>
(() => {
  const roLink = document.getElementById("lang-ro");
  if (roLink && location.search) roLink.search = location.search;

  const SB_URL = "https://jauggqxhemjnbxoxkpeh.supabase.co";
  const SB_KEY = "sb_publishable_GDFhOi3Ek3XmECz2NHQC0g_3qPvPC93"; // offentlig publishable key (kun insert via RLS)
  const BUCKET = "foto-upload", MAX_PX = 2500, MAX_BYTES = 950 * 1024;
  const $ = (id) => document.getElementById(id);
  let category = null, files = [];

  const nameEl = $("name");
  nameEl.value = localStorage.getItem("zenko_foto_navn") || "";
  nameEl.addEventListener("change", () => localStorage.setItem("zenko_foto_navn", nameEl.value.trim()));

  const kat = new URLSearchParams(location.search).get("kat");
  document.querySelectorAll(".cat").forEach((b) => {
    b.addEventListener("click", () => pick(b.dataset.v));
  });
  function pick(v) {
    category = v;
    document.querySelectorAll(".cat").forEach((x) => x.setAttribute("aria-pressed", x.dataset.v === v ? "true" : "false"));
    $("cats").classList.add("picked"); refresh();
  }
  if (["kvalitetssikring","ekstra_arbejde","problemer"].includes(kat)) pick(kat);

  $("files").addEventListener("change", (e) => {
    for (const f of e.target.files) if (f.type.startsWith("image/") || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)) files.push(f);
    e.target.value = ""; render();
  });
  function render() {
    const t = $("thumbs"); t.innerHTML = "";
    files.forEach((f, i) => {
      const d = document.createElement("div"), img = document.createElement("img"), x = document.createElement("button");
      img.src = URL.createObjectURL(f); img.alt = f.name; x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "Fjern");
      x.onclick = () => { files.splice(i, 1); render(); };
      d.append(img, x); t.append(d);
    });
    $("count").textContent = files.length ? files.length + " billede(r) valgt · wybrano zdjęć: " + files.length : "";
    refresh();
  }
  function refresh() { $("send").disabled = !(category && files.length); }
  function msg(cls, html) { const m = $("msg"); m.className = cls; m.innerHTML = html; }

  async function compress(f) {
    try {
      const bmp = await createImageBitmap(f, { imageOrientation: "from-image" });
      const s = Math.min(1, MAX_PX / Math.max(bmp.width, bmp.height));
      let w = Math.round(bmp.width * s), h = Math.round(bmp.height * s), q = 0.85, blob;
      const c = document.createElement("canvas");
      for (let i = 0; i < 8; i++) {
        c.width = w; c.height = h; c.getContext("2d").drawImage(bmp, 0, 0, w, h);
        blob = await new Promise((r) => c.toBlob(r, "image/jpeg", q));
        if (blob && blob.size <= MAX_BYTES) break;
        if (q > 0.6) q -= 0.1; else { w = Math.round(w * 0.8); h = Math.round(h * 0.8); }
      }
      if (blob) return { blob, type: "image/jpeg", ext: "jpg" };
    } catch (e) { console.warn("compress fail", e); }
    if (f.size > 8 * 1024 * 1024) throw new Error("Billedet er for stort / Zdjęcie jest za duże");
    const ext = (f.name.split(".").pop() || "jpg").toLowerCase();
    return { blob: f, type: f.type || "image/jpeg", ext };
  }
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
    "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }));

  $("send").addEventListener("click", async () => {
    if (!category || !files.length) return;
    const btn = $("send"); btn.disabled = true;
    const note = $("note").value.trim() || null, uploader = nameEl.value.trim() || null;
    if (uploader) localStorage.setItem("zenko_foto_navn", uploader);
    const batch = uuid(), day = new Date().toISOString().slice(0, 10);
    let ok = 0, fail = 0; const left = [];
    for (let i = 0; i < files.length; i++) {
      msg("busy", `Sender ${i + 1} af ${files.length}… <span class="pl">Wysyłanie ${i + 1} z ${files.length}…</span>`);
      try {
        const f = files[i], id = uuid(), c = await compress(f);
        const path = `uploads/${day}/${id}.${c.ext}`;
        const up = await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`, {
          method: "POST", headers: { apikey: SB_KEY, "Content-Type": c.type, "x-upsert": "false" }, body: c.blob });
        if (!up.ok) throw new Error("upload " + up.status + " " + (await up.text()).slice(0, 120));
        const ins = await fetch(`${SB_URL}/rest/v1/foto_upload`, {
          method: "POST",
          headers: { apikey: SB_KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
          body: JSON.stringify({ id, batch_id: batch, category, note, uploader, filename: (f.name || "foto").slice(0, 200),
            storage_path: path, content_type: c.type, size_bytes: c.blob.size, user_agent: navigator.userAgent.slice(0, 300) }) });
        if (!ins.ok) throw new Error("db " + ins.status + " " + (await ins.text()).slice(0, 120));
        ok++;
      } catch (e) { console.error(e); fail++; left.push(files[i]); }
    }
    files = left; render();
    if (!fail) {
      msg("ok", `✔ Sendt! ${ok} billede(r). Tak! <span class="pl">Wysłano! ${ok} zdjęć. Dziękuję!</span>`);
      $("note").value = "";
    } else {
      msg("err", `✖ ${fail} fejlede, ${ok} sendt. Tjek internet og tryk SEND igen. <span class="pl">${fail} nie wysłano. Sprawdź internet i naciśnij WYŚLIJ ponownie.</span>`);
    }
    refresh();
  });
})();
</script>
</body>
</html>
